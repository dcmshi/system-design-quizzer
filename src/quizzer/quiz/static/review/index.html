<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Review &mdash; System Design Quizzer</title>
  <meta name="description" content="Review, edit, approve or reject generated system design questions before they enter the quiz bank.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/review.css">
</head>
<body>
<div id="app">

  <header class="page-header">
    <h1>Question Review</h1>
    <div class="nav-links">
      <a href="/sources/" class="back-link">Sources →</a>
      <a href="/" class="back-link">&larr; Back to Quiz</a>
    </div>
  </header>

  <div class="filter-bar">
    <select id="filter-status">
      <option value="generated">Generated</option>
      <option value="approved">Approved</option>
      <option value="edited">Edited</option>
      <option value="rejected">Rejected</option>
      <option value="">All statuses</option>
    </select>
    <select id="filter-doc">
      <option value="">All documents</option>
    </select>
    <button class="btn btn-reingest" id="reingest-btn" disabled title="Re-run ingestion for selected document">&#x21BA; Re-ingest</button>
    <select id="filter-diff">
      <option value="">Any difficulty</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <select id="filter-model">
      <option value="">Any model</option>
    </select>
    <select id="filter-prompt">
      <option value="">Any prompt version</option>
    </select>
    <input type="search" id="filter-search" placeholder="Search questions…" />
  </div>

  <div class="bulk-bar">
    <label>
      <input type="checkbox" id="select-all"> Select all on page
    </label>
    <span class="bulk-spacer"></span>
    <button class="btn btn-bulk-approve" id="bulk-approve-btn" disabled>
      Approve selected (0)
    </button>
    <button class="btn btn-bulk-reject" id="bulk-reject-btn" disabled>
      Reject selected (0)
    </button>
    <button class="btn btn-bulk-delete" id="bulk-delete-btn" disabled>
      Delete selected (0)
    </button>
  </div>

  <p id="summary" class="summary"></p>
  <div id="question-list" class="question-list"></div>
  <div id="pagination" class="pagination"></div>

</div>
<script src="/js/toast.js"></script>
<script src="/js/api.js"></script>
<script src="/js/review.js"></script>
</body>
</html>
