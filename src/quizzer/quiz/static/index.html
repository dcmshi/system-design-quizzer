<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Design Quizzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #6366f1;
      --accent-hover: #4f51d9;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    #app {
      width: 100%;
      max-width: 680px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    input[type="number"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      font-family: var(--font);
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus, select:focus {
      border-color: var(--accent);
    }
    select option { background: var(--surface2); }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font);
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Loading spinner ── */
    #screen-loading {
      text-align: center;
      padding: 3rem 0;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); }

    /* ── Question screen ── */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .score-display { font-weight: 600; }

    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .difficulty-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }
    .badge-easy   { background: #14532d; color: #86efac; }
    .badge-medium { background: #713f12; color: #fde68a; }
    .badge-hard   { background: #7f1d1d; color: #fca5a5; }
    .badge-unknown { background: var(--surface2); color: var(--text-muted); }

    .question-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      text-align: left;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: var(--font);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface);
    }
    .option-btn:disabled { cursor: default; }
    .option-btn.focused:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface);
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .option-btn.correct {
      border-color: var(--green);
      background: #14532d33;
      color: #86efac;
    }
    .option-btn.wrong {
      border-color: var(--red);
      background: #7f1d1d33;
      color: #fca5a5;
    }

    .explanation {
      display: none;
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 0.9rem 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .explanation.visible { display: block; }
    .explanation strong { color: var(--text); }

    .next-row {
      display: flex;
      justify-content: flex-end;
    }
    #btn-next {
      display: none;
    }
    #btn-next.visible {
      display: inline-block;
    }

    .shortfall-notice {
      font-size: 0.8rem;
      color: #fde68a;
      background: #71400833;
      border: 1px solid #92400e;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }
    .shortfall-notice.visible { display: block; }

    .kb-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.5;
      margin-top: 0.75rem;
      letter-spacing: 0.03em;
    }

    /* ── End screen ── */
    .end-score {
      text-align: center;
      padding: 1rem 0 1.5rem;
    }
    .score-big {
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .score-fraction {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .score-message {
      font-size: 1.1rem;
      margin-top: 1rem;
      font-weight: 500;
    }
    .end-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .end-actions .btn { flex: 1; }

    /* ── Review screen ── */
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .review-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    #review-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .review-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .review-q-num {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .review-result-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
    }
    .review-result-badge.correct { background: #14532d; color: #86efac; }
    .review-result-badge.wrong   { background: #7f1d1d; color: #fca5a5; }
    .review-q-text {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.55;
      margin: 0.5rem 0 1rem;
    }
    .review-options {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }
    .review-option {
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .review-option.correct {
      border-color: var(--green);
      background: #14532d33;
      color: #86efac;
    }
    .review-option.wrong {
      border-color: var(--red);
      background: #7f1d1d33;
      color: #fca5a5;
    }
    .review-expl {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .review-expl strong { color: var(--text); }

    /* ── Error screen ── */
    .error-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .error-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .error-msg {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .error-msg code {
      background: var(--surface2);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Setup -->
  <div id="screen-setup" class="screen active">
    <div class="card">
      <h1>System Design Quiz</h1>
      <p class="subtitle">Test your knowledge of distributed systems & architecture</p>

      <label for="input-doc">Question bank</label>
      <select id="input-doc">
        <option value="">All documents</option>
      </select>

      <label for="input-n">Number of questions</label>
      <input type="number" id="input-n" value="5" min="1" max="50">

      <label for="input-diff">Difficulty</label>
      <select id="input-diff">
        <option value="">Any difficulty</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <button class="btn btn-primary" id="btn-start">Start Quiz</button>
      <p style="text-align:center;margin-top:1rem;">
        <a href="/review/" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none;">
          Review questions &rarr;
        </a>
      </p>
    </div>
  </div>

  <!-- Loading -->
  <div id="screen-loading" class="screen">
    <div class="spinner"></div>
    <p class="loading-text">Loading questions&hellip;</p>
  </div>

  <!-- Question -->
  <div id="screen-question" class="screen">
    <div class="card">
      <div class="quiz-header">
        <span id="progress-label">Question 1 of 5</span>
        <span class="score-display" id="score-label">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="shortfall-notice" id="shortfall-notice"></div>
      <span class="difficulty-badge" id="difficulty-badge"></span>
      <p class="question-text" id="question-text"></p>
      <div class="options" id="options-container"></div>
      <div class="explanation" id="explanation"></div>
      <div class="next-row">
        <button class="btn btn-primary" id="btn-next">Next &rarr;</button>
      </div>
      <p class="kb-hint">1&ndash;4 select &middot; Enter confirm &middot; &rarr; next</p>
    </div>
  </div>

  <!-- End -->
  <div id="screen-end" class="screen">
    <div class="card">
      <div class="end-score">
        <div class="score-big" id="end-pct"></div>
        <div class="score-fraction" id="end-fraction"></div>
        <div class="score-message" id="end-msg"></div>
      </div>
      <div class="end-actions">
        <button class="btn btn-secondary" id="btn-review">Back to Setup</button>
        <button class="btn btn-primary" id="btn-play-again">Play Again</button>
      </div>
      <button class="btn btn-secondary" id="btn-show-review" style="width:100%;margin-top:0.5rem;">Review Answers</button>
      <button class="btn btn-secondary" id="btn-retry-missed" style="width:100%;margin-top:0.5rem;display:none;"></button>
    </div>
  </div>

  <!-- Review -->
  <div id="screen-review" class="screen">
    <div class="review-header">
      <h2>Quiz Review</h2>
      <button class="btn btn-secondary" id="btn-back-end" style="padding:0.4rem 1rem;font-size:0.85rem;">&larr; Results</button>
    </div>
    <div id="review-list"></div>
  </div>

  <!-- Error -->
  <div id="screen-error" class="screen">
    <div class="card" style="text-align:center">
      <div class="error-icon">&#9888;</div>
      <div class="error-title" id="error-title">Something went wrong</div>
      <p class="error-msg" id="error-msg"></p>
      <button class="btn btn-primary" id="btn-retry">Try Again</button>
    </div>
  </div>

</div>

<script>
  'use strict';

  // ── Screens ──────────────────────────────────────────────────────────────
  const screens = {
    setup:    document.getElementById('screen-setup'),
    loading:  document.getElementById('screen-loading'),
    question: document.getElementById('screen-question'),
    end:      document.getElementById('screen-end'),
    review:   document.getElementById('screen-review'),
    error:    document.getElementById('screen-error'),
  };

  let currentScreen = 'setup';

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    currentScreen = name;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  const state = {
    questions: [],
    current: 0,
    score: 0,
    answered: false,
    totalRequested: 5,
    keyboardFocus: null,
    results: [],
  };

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const inputDoc     = document.getElementById('input-doc');
  const inputN       = document.getElementById('input-n');
  const inputDiff    = document.getElementById('input-diff');
  const btnStart     = document.getElementById('btn-start');
  const progressFill     = document.getElementById('progress-fill');
  const progressLbl      = document.getElementById('progress-label');
  const shortfallNotice  = document.getElementById('shortfall-notice');
  const scoreLbl     = document.getElementById('score-label');
  const diffBadge    = document.getElementById('difficulty-badge');
  const questionText = document.getElementById('question-text');
  const optionsCont  = document.getElementById('options-container');
  const explanation  = document.getElementById('explanation');
  const btnNext      = document.getElementById('btn-next');
  const endPct       = document.getElementById('end-pct');
  const endFraction  = document.getElementById('end-fraction');
  const endMsg       = document.getElementById('end-msg');
  const btnPlayAgain   = document.getElementById('btn-play-again');
  const btnReview      = document.getElementById('btn-review');
  const btnShowReview  = document.getElementById('btn-show-review');
  const btnRetryMissed = document.getElementById('btn-retry-missed');
  const btnBackEnd     = document.getElementById('btn-back-end');
  const reviewList     = document.getElementById('review-list');
  const errorTitle     = document.getElementById('error-title');
  const errorMsg     = document.getElementById('error-msg');
  const btnRetry     = document.getElementById('btn-retry');

  // ── Helpers ───────────────────────────────────────────────────────────────
  const LABELS = ['A', 'B', 'C', 'D'];

  function difficultyClass(d) {
    return { easy: 'badge-easy', medium: 'badge-medium', hard: 'badge-hard' }[d] || 'badge-unknown';
  }

  function scoreMessage(pct) {
    if (pct === 100) return 'Perfect score!';
    if (pct >= 80)  return 'Great work!';
    if (pct >= 60)  return 'Good effort!';
    if (pct >= 40)  return 'Keep practising.';
    return 'Keep studying — you\'ll get there!';
  }

  function showError(title, msg) {
    errorTitle.textContent = title;
    errorMsg.innerHTML = msg;
    showScreen('error');
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  const KEY_TO_INDEX = { '1': 0, '2': 1, '3': 2, '4': 3 };

  function setKeyboardFocus(idx) {
    state.keyboardFocus = idx;
    optionsCont.querySelectorAll('.option-btn').forEach((b, i) => {
      b.classList.toggle('focused', i === idx);
    });
  }

  function clearKeyboardFocus() {
    state.keyboardFocus = null;
    optionsCont.querySelectorAll('.option-btn').forEach(b => b.classList.remove('focused'));
  }

  function handleKeyDown(e) {
    if (currentScreen !== 'question') return;

    // 1–4: highlight option
    const digit = KEY_TO_INDEX[e.key];
    if (digit !== undefined) {
      const btns = optionsCont.querySelectorAll('.option-btn');
      if (digit < btns.length && !state.answered) {
        e.preventDefault();
        setKeyboardFocus(digit);
      }
      return;
    }

    // Enter / Space: confirm selection or advance
    if (e.key === 'Enter' || e.key === ' ') {
      // Let native button-click handle it when a <button> has DOM focus
      if (document.activeElement?.tagName === 'BUTTON') return;
      e.preventDefault();
      if (!state.answered && state.keyboardFocus !== null) {
        const btns = optionsCont.querySelectorAll('.option-btn');
        handleAnswer(state.keyboardFocus, btns[state.keyboardFocus]);
      } else if (state.answered && btnNext.classList.contains('visible')) {
        nextQuestion();
      }
      return;
    }

    // →: advance to next question
    if (e.key === 'ArrowRight') {
      if (state.answered && btnNext.classList.contains('visible')) {
        nextQuestion();
      }
    }
  }

  // ── API calls ─────────────────────────────────────────────────────────────
  async function loadDocuments() {
    try {
      const res = await fetch('/api/v1/documents');
      if (!res.ok) return;
      const docs = await res.json();
      docs.forEach(doc => {
        const opt = document.createElement('option');
        opt.value = doc.id;
        opt.textContent = `${doc.title} (${doc.question_count} Q)`;
        inputDoc.appendChild(opt);
      });
    } catch (_) {
      // Non-fatal — dropdown just stays as "All documents"
    }
  }

  async function fetchQuestions(n, difficulty, documentId) {
    let url = `/api/v1/quiz?n=${n}`;
    if (difficulty) url += `&difficulty=${encodeURIComponent(difficulty)}`;
    if (documentId) url += `&document_id=${encodeURIComponent(documentId)}`;
    const res = await fetch(url);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${res.status}`);
    }
    return res.json();
  }

  async function submitAnswer(questionId, selectedIndex) {
    const res = await fetch(`/api/v1/questions/${questionId}/answer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ selected_index: selectedIndex }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${res.status}`);
    }
    return res.json();
  }

  // ── Quiz flow ─────────────────────────────────────────────────────────────
  async function startQuiz() {
    let n = parseInt(inputN.value, 10);
    if (!n || n < 1) n = 1;
    n = Math.min(n, 50);

    const difficulty  = inputDiff.value.trim();
    const documentId  = inputDoc.value.trim();

    state.totalRequested = n;
    state.questions = [];
    state.current = 0;
    state.score = 0;
    state.answered = false;
    state.results = [];

    showScreen('loading');

    try {
      const data = await fetchQuestions(n, difficulty, documentId);
      if (!data.questions || data.questions.length === 0) {
        const docLabel = inputDoc.options[inputDoc.selectedIndex]?.text;
        const context = documentId ? ` in <strong>${docLabel}</strong>` : '';
        showError(
          'No questions found',
          `No questions are available${context}${difficulty ? ` for difficulty <strong>${difficulty}</strong>` : ''}. ` +
          `Ingest some articles first:<br><br>` +
          `<code>uv run python scripts/ingest.py --source content/&lt;article&gt;.md --verbose</code>`
        );
        return;
      }
      state.questions = data.questions;

      if (data.returned < data.requested) {
        shortfallNotice.textContent =
          `Only ${data.returned} of ${data.requested} requested questions available with these filters.`;
        shortfallNotice.classList.add('visible');
      } else {
        shortfallNotice.classList.remove('visible');
      }

      renderQuestion();
      showScreen('question');
    } catch (err) {
      showError('Failed to load questions', `Could not reach the API: ${err.message}`);
    }
  }

  function renderQuestion() {
    const q = state.questions[state.current];
    const total = state.questions.length;
    const idx = state.current;

    state.answered = false;
    state.keyboardFocus = null;

    // Header
    progressLbl.textContent = `Question ${idx + 1} of ${total}`;
    scoreLbl.textContent = `Score: ${state.score}`;
    progressFill.style.width = `${(idx / total) * 100}%`;

    // Difficulty badge
    diffBadge.textContent = q.difficulty || 'unknown';
    diffBadge.className = 'difficulty-badge ' + difficultyClass(q.difficulty);

    // Question
    questionText.textContent = q.question;

    // Options
    optionsCont.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = `${LABELS[i]}. ${opt}`;
      btn.addEventListener('click', () => handleAnswer(i, btn));
      optionsCont.appendChild(btn);
    });

    // Reset explanation + next
    explanation.textContent = '';
    explanation.classList.remove('visible');
    btnNext.classList.remove('visible');
  }

  async function handleAnswer(selectedIndex, clickedBtn) {
    if (state.answered) return;
    state.answered = true;

    // Disable all options immediately and clear keyboard focus highlight
    const allBtns = optionsCont.querySelectorAll('.option-btn');
    allBtns.forEach(b => { b.disabled = true; });
    clearKeyboardFocus();

    const q = state.questions[state.current];

    try {
      const result = await submitAnswer(q.id, selectedIndex);

      // Colour feedback
      allBtns[result.correct_index].classList.add('correct');
      if (!result.correct) {
        clickedBtn.classList.add('wrong');
      }

      if (result.correct) state.score++;

      // Record result for end-of-quiz review
      state.results.push({
        question:      q,
        selectedIndex: selectedIndex,
        correct:       result.correct,
        correctIndex:  result.correct_index,
        explanation:   result.explanation,
      });

      // Explanation
      explanation.innerHTML = `<strong>Explanation:</strong> ${result.explanation}`;
      explanation.classList.add('visible');

      // Next / Finish button
      btnNext.textContent = state.current + 1 < state.questions.length ? 'Next \u2192' : 'See Results';
      btnNext.classList.add('visible');
    } catch (err) {
      // Re-enable so user can try again
      state.answered = false;
      allBtns.forEach(b => { b.disabled = false; });
      showError('Answer submission failed', err.message);
    }
  }

  function nextQuestion() {
    state.current++;
    if (state.current < state.questions.length) {
      renderQuestion();
    } else {
      showEnd();
    }
  }

  function showEnd() {
    const total = state.questions.length;
    const pct = total > 0 ? Math.round((state.score / total) * 100) : 0;

    // Final progress fill
    progressFill.style.width = '100%';

    endPct.textContent = `${pct}%`;
    endFraction.textContent = `${state.score} / ${total} correct`;
    endMsg.textContent = scoreMessage(pct);

    // Show "Retry missed" only when there are wrong answers
    const missedCount = state.results.filter(r => !r.correct).length;
    if (missedCount > 0) {
      btnRetryMissed.textContent = `Retry missed (${missedCount})`;
      btnRetryMissed.style.display = 'block';
    } else {
      btnRetryMissed.style.display = 'none';
    }

    showScreen('end');
  }

  function replayMissed() {
    const missed = state.results.filter(r => !r.correct).map(r => r.question);
    state.questions = missed;
    state.current = 0;
    state.score = 0;
    state.answered = false;
    state.results = [];
    state.keyboardFocus = null;
    shortfallNotice.classList.remove('visible');
    renderQuestion();
    showScreen('question');
  }

  function showReview() {
    reviewList.innerHTML = '';

    state.results.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'card';

      // Q number + result badge
      const header = document.createElement('div');
      header.className = 'review-q-header';

      const qNum = document.createElement('span');
      qNum.className = 'review-q-num';
      qNum.textContent = `Question ${i + 1} of ${state.results.length}`;

      const badge = document.createElement('span');
      badge.className = `review-result-badge ${r.correct ? 'correct' : 'wrong'}`;
      badge.textContent = r.correct ? '✓ Correct' : '✗ Incorrect';

      header.appendChild(qNum);
      header.appendChild(badge);
      card.appendChild(header);

      // Difficulty badge
      const diff = document.createElement('span');
      diff.className = 'difficulty-badge ' + difficultyClass(r.question.difficulty);
      diff.textContent = r.question.difficulty || 'unknown';
      card.appendChild(diff);

      // Question text
      const qText = document.createElement('p');
      qText.className = 'review-q-text';
      qText.textContent = r.question.question;
      card.appendChild(qText);

      // Options
      const optsDiv = document.createElement('div');
      optsDiv.className = 'review-options';
      r.question.options.forEach((opt, oi) => {
        const optDiv = document.createElement('div');
        optDiv.className = 'review-option';
        const isCorrect  = oi === r.correctIndex;
        const isSelected = oi === r.selectedIndex;
        if (isCorrect)       optDiv.classList.add('correct');
        else if (isSelected) optDiv.classList.add('wrong');
        let text = `${LABELS[oi]}. ${opt}`;
        if (isSelected && !isCorrect) text += '  ← your answer';
        optDiv.textContent = text;
        optsDiv.appendChild(optDiv);
      });
      card.appendChild(optsDiv);

      // Explanation
      const expl = document.createElement('div');
      expl.className = 'review-expl';
      expl.innerHTML = `<strong>Explanation:</strong> ${r.explanation}`;
      card.appendChild(expl);

      reviewList.appendChild(card);
    });

    showScreen('review');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  document.addEventListener('keydown', handleKeyDown);

  btnStart.addEventListener('click', startQuiz);
  btnNext.addEventListener('click', nextQuestion);
  btnPlayAgain.addEventListener('click', startQuiz);
  btnReview.addEventListener('click', () => showScreen('setup'));
  btnShowReview.addEventListener('click', showReview);
  btnRetryMissed.addEventListener('click', replayMissed);
  btnBackEnd.addEventListener('click', () => { showScreen('end'); window.scrollTo({ top: 0, behavior: 'instant' }); });
  btnRetry.addEventListener('click', () => showScreen('setup'));

  // Allow Enter key in the setup inputs to start the quiz
  [inputDoc, inputN, inputDiff].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') startQuiz();
    });
  });

  // Populate document dropdown on load
  loadDocuments();
</script>
</body>
</html>
