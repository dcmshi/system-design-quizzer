<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source Articles &mdash; System Design Quizzer</title>
  <meta name="description" content="The source articles behind the question bank, with chunk, word and question counts.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/sources.css">
</head>
<body>
<div id="app">
  <div class="page-header">
    <h1>Source Articles</h1>
    <div class="header-links">
      <a class="back-link" href="/review/">Review UI →</a>
      <a class="back-link" href="/">Quiz →</a>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar" style="display:none"></div>

  <div class="filter-bar">
    <input type="search" id="search" placeholder="Filter by title or path…" autocomplete="off">
    <select id="filter-source">
      <option value="">All sources</option>
    </select>
    <select id="filter-tag">
      <option value="">All tags</option>
    </select>
    <select id="sort-by">
      <option value="title">Sort: Title</option>
      <option value="created_at">Sort: Date ingested</option>
      <option value="question_count">Sort: Questions</option>
      <option value="word_count">Sort: Words</option>
      <option value="chunk_count">Sort: Chunks</option>
    </select>
  </div>

  <p class="summary" id="summary"></p>

  <div class="table-wrap">
    <table id="doc-table">
      <thead>
        <tr>
          <th class="sortable" data-col="title">Title <span class="sort-icon">↕</span></th>
          <th>Source</th>
          <th class="tags-cell">Tags</th>
          <th class="sortable num-cell" data-col="chunk_count">Chunks <span class="sort-icon">↕</span></th>
          <th class="sortable num-cell" data-col="word_count">Words <span class="sort-icon">↕</span></th>
          <th class="sortable num-cell" data-col="question_count">Questions <span class="sort-icon">↕</span></th>
          <th class="sortable" data-col="created_at">Ingested <span class="sort-icon">↕</span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="doc-body">
        <tr><td colspan="8" class="state-msg">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/js/sources.js"></script>
</body>
</html>
