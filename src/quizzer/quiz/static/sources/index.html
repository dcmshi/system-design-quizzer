<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source Articles &mdash; System Design Quizzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #6366f1;
      --accent-hover: #4f51d9;
      --green: #22c55e;
      --green-bg: #14532d33;
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }

    #app { width: 100%; max-width: 1000px; margin: 0 auto; }

    /* ── Header ── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; }
    .header-links { display: flex; gap: 1.25rem; }
    .back-link { color: var(--text-muted); font-size: 0.875rem; text-decoration: none; }
    .back-link:hover { color: var(--accent); }

    /* ── Summary ── */
    .summary { font-size: 0.825rem; color: var(--text-muted); margin-bottom: 1rem; min-height: 1.2em; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .filter-bar input[type=search] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      font-size: 0.875rem;
      font-family: var(--font);
      outline: none;
      flex: 1;
      min-width: 200px;
    }
    .filter-bar input[type=search]:focus { border-color: var(--accent); }
    .filter-bar input[type=search]::placeholder { color: var(--text-muted); }
    .filter-bar select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      font-size: 0.875rem;
      font-family: var(--font);
      outline: none;
      cursor: pointer;
      min-width: 130px;
    }
    .filter-bar select:focus { border-color: var(--accent); }
    .filter-bar select option { background: var(--surface2); }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.65rem 1rem;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { color: var(--text); }
    thead th .sort-icon { margin-left: 0.3rem; opacity: 0.4; }
    thead th.sort-asc .sort-icon, thead th.sort-desc .sort-icon { opacity: 1; color: var(--accent); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    td { padding: 0.8rem 1rem; vertical-align: middle; }

    .doc-title-cell { max-width: 280px; }
    .doc-title {
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      line-height: 1.4;
      display: block;
      word-break: break-word;
    }
    .doc-title:hover { color: var(--accent); }
    .doc-path {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      word-break: break-all;
      font-family: monospace;
    }

    .source-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .tags-cell { max-width: 180px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: #1e3a5f;
      color: #93c5fd;
      white-space: nowrap;
    }

    .num-cell { text-align: right; color: var(--text-muted); }
    .num-cell strong { color: var(--text); }

    .q-count { font-weight: 700; }
    .q-zero { color: var(--text-muted); }

    .date-cell {
      color: var(--text-muted);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .action-cell { white-space: nowrap; }
    .btn-review {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-review:hover { border-color: var(--accent); color: var(--accent); }

    /* ── State messages ── */
    .state-msg { text-align: center; padding: 3rem 0; color: var(--text-muted); font-size: 0.9rem; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
<div id="app">
  <div class="page-header">
    <h1>Source Articles</h1>
    <div class="header-links">
      <a class="back-link" href="/review/">Review UI →</a>
      <a class="back-link" href="/">Quiz →</a>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar" style="display:none"></div>

  <div class="filter-bar">
    <input type="search" id="search" placeholder="Filter by title or path…" autocomplete="off">
    <select id="filter-source">
      <option value="">All sources</option>
    </select>
    <select id="filter-tag">
      <option value="">All tags</option>
    </select>
    <select id="sort-by">
      <option value="title">Sort: Title</option>
      <option value="created_at">Sort: Date ingested</option>
      <option value="question_count">Sort: Questions</option>
      <option value="word_count">Sort: Words</option>
      <option value="chunk_count">Sort: Chunks</option>
    </select>
  </div>

  <p class="summary" id="summary"></p>

  <div class="table-wrap">
    <table id="doc-table">
      <thead>
        <tr>
          <th class="sortable" data-col="title">Title <span class="sort-icon">↕</span></th>
          <th>Source</th>
          <th class="tags-cell">Tags</th>
          <th class="sortable num-cell" data-col="chunk_count">Chunks <span class="sort-icon">↕</span></th>
          <th class="sortable num-cell" data-col="word_count">Words <span class="sort-icon">↕</span></th>
          <th class="sortable num-cell" data-col="question_count">Questions <span class="sort-icon">↕</span></th>
          <th class="sortable" data-col="created_at">Ingested <span class="sort-icon">↕</span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="doc-body">
        <tr><td colspan="8" class="state-msg">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let allDocs = [];
  let sortCol = 'title';
  let sortDir = 1; // 1 = asc, -1 = desc

  const tbody = document.getElementById('doc-body');
  const summary = document.getElementById('summary');
  const searchInput = document.getElementById('search');
  const filterSource = document.getElementById('filter-source');
  const filterTag = document.getElementById('filter-tag');
  const sortSelect = document.getElementById('sort-by');
  const statsBar = document.getElementById('stats-bar');

  async function load() {
    try {
      const res = await fetch('/api/v1/documents');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allDocs = await res.json();
      populateFilters();
      renderStats();
      render();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8" class="state-msg">Failed to load documents: ${e.message}</td></tr>`;
    }
  }

  function populateFilters() {
    const sources = [...new Set(allDocs.map(d => d.source).filter(Boolean))].sort();
    sources.forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      filterSource.appendChild(o);
    });

    const tags = [...new Set(allDocs.flatMap(d => d.tags || []))].sort();
    tags.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      filterTag.appendChild(o);
    });
  }

  function renderStats() {
    const totalDocs = allDocs.length;
    const totalChunks = allDocs.reduce((s, d) => s + (d.chunk_count || 0), 0);
    const totalWords = allDocs.reduce((s, d) => s + (d.word_count || 0), 0);
    const totalQs = allDocs.reduce((s, d) => s + (d.question_count || 0), 0);

    statsBar.style.display = 'flex';
    statsBar.innerHTML = [
      ['Documents', totalDocs.toLocaleString()],
      ['Chunks', totalChunks.toLocaleString()],
      ['Total words', fmtWords(totalWords)],
      ['Questions', totalQs.toLocaleString()],
    ].map(([label, value]) => `
      <div class="stat-item">
        <span class="stat-value">${value}</span>
        <span class="stat-label">${label}</span>
      </div>
    `).join('');
  }

  function fmtWords(n) {
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return n.toLocaleString();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function filtered() {
    const q = searchInput.value.trim().toLowerCase();
    const src = filterSource.value;
    const tag = filterTag.value;
    return allDocs.filter(d => {
      if (q && !d.title.toLowerCase().includes(q) && !d.source_path.toLowerCase().includes(q)) return false;
      if (src && d.source !== src) return false;
      if (tag && !(d.tags || []).includes(tag)) return false;
      return true;
    });
  }

  function sorted(docs) {
    return [...docs].sort((a, b) => {
      let av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -sortDir;
      if (av > bv) return sortDir;
      return 0;
    });
  }

  function updateSortHeaders() {
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      th.classList.remove('sort-asc', 'sort-desc');
      const icon = th.querySelector('.sort-icon');
      if (th.dataset.col === sortCol) {
        th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
        if (icon) icon.textContent = sortDir === 1 ? '↑' : '↓';
      } else {
        if (icon) icon.textContent = '↕';
      }
    });
  }

  function render() {
    const docs = sorted(filtered());
    updateSortHeaders();

    summary.textContent = docs.length === allDocs.length
      ? `${allDocs.length} article${allDocs.length !== 1 ? 's' : ''}`
      : `${docs.length} of ${allDocs.length} articles`;

    if (docs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="state-msg">No articles match the current filters.</td></tr>`;
      return;
    }

    tbody.innerHTML = docs.map(d => {
      const tags = (d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
      const qClass = d.question_count === 0 ? 'q-zero' : 'q-count';
      const reviewUrl = `/review/?document_id=${encodeURIComponent(d.id)}`;
      return `
        <tr>
          <td class="doc-title-cell">
            <a class="doc-title" href="${reviewUrl}">${esc(d.title)}</a>
            <div class="doc-path">${esc(d.source_path)}</div>
          </td>
          <td><span class="source-badge">${esc(d.source || '—')}</span></td>
          <td class="tags-cell"><div class="tag-list">${tags || '<span style="color:var(--text-muted);font-size:0.8rem">—</span>'}</div></td>
          <td class="num-cell"><strong>${d.chunk_count ?? 0}</strong></td>
          <td class="num-cell"><strong>${fmtWords(d.word_count ?? 0)}</strong></td>
          <td class="num-cell"><strong class="${qClass}">${d.question_count ?? 0}</strong></td>
          <td class="date-cell">${fmtDate(d.created_at)}</td>
          <td class="action-cell"><a class="btn-review" href="${reviewUrl}">Review →</a></td>
        </tr>
      `;
    }).join('');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Events
  searchInput.addEventListener('input', render);
  filterSource.addEventListener('change', render);
  filterTag.addEventListener('change', render);
  sortSelect.addEventListener('change', () => {
    sortCol = sortSelect.value;
    sortDir = ['question_count', 'word_count', 'chunk_count'].includes(sortCol) ? -1 : 1;
    render();
  });

  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      if (sortCol === th.dataset.col) {
        sortDir = -sortDir;
      } else {
        sortCol = th.dataset.col;
        sortDir = ['question_count', 'word_count', 'chunk_count'].includes(sortCol) ? -1 : 1;
      }
      sortSelect.value = sortCol;
      render();
    });
  });

  load();
</script>
</body>
</html>
