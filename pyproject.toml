[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "system-design-quizzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "python-frontmatter>=1.1.0",
    "jsonschema>=4.22.0",
    "python-ulid>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "ruff>=0.4.0"]
preprocessing = ["beautifulsoup4>=4.12.0", "markdownify>=0.13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/quizzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
